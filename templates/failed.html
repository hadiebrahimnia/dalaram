<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link href="{% static 'plugins/bootstrap/css/bootstrap.rtl.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/pcm.css' %}" rel="stylesheet" />
    <title>پایان آزمون</title>
  </head>
  <body>
    <div id="rotate-device">
      <i>↻</i>
      <h3>لطفاً گوشی را بچرخانید</h3>
      <p>برای تجربه بهتر، صفحه را به حالت افقی ببرید</p>
    </div>
    <div class="row" style=" height: 100vh; ">
      <div id="intro" class="card col-md-8 m-auto border-0" style="background:#daa52040;">
        <div class="card-body text-center p-5">
          <h2 class="mb-4">{{ text }}</h2>
          <p class="mt-4">از شرکت شما در این آزمون سپاسگزاریم.</p>
          <a  href="/" class="btn btn-secondary btn-lg mt-5" id="start-trial"> بازگشت</a>
        </div>
      </div>
    </div>
  </body>

  <script>
    document.querySelectorAll('.content > div:not(#rotate-device)').forEach(function(el) {
      el.classList.add('hidden');
    });
  </script>

</html>
